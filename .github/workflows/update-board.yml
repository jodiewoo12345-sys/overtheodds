name: Update board

# Runs the sweep twice a day and pushes the new feed.json into the site.
# Times are UTC. 06:00 catches overnight prices, 11:00 refreshes before
# the afternoon's events.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Nothing to settle until selections have finished, so never fail on this.
      - name: Settle finished picks
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python settle.py

      - name: Sweep for value
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MIN_EDGE: "2"
          MIN_BOOKS: "5"
          MAX_ODDS: "6"
          MAX_EDGE: "12"
          MIN_HOURS: "2"
          MAX_PER_SPORT: "15"
        run: python sweep.py

      - name: Publish
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing changed" && exit 0
          git commit -m "Board update $(date -u '+%Y-%m-%d %H:%M')"
          git push
