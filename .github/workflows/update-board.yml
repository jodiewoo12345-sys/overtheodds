name: Update board

# One sweep a day, which is what the free API tier allows.
# 06:00 UTC catches overnight prices before the day's events.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Settle finished picks
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python settle.py

      # All settings live in sweep.py's defaults. Override here only when testing.
      - name: Sweep for value
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sweep.py

      - name: Publish
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing changed" && exit 0
          git commit -m "Board update $(date -u '+%Y-%m-%d %H:%M')"
          git push
