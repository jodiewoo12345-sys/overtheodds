name: Closing prices

# Every quarter of an hour, freeze the closing price for any selection about to
# start. Most runs do nothing and cost nothing: the script only calls the API when
# a published bet is inside the T-16 to T-4 window, and stops once it has spent
# its daily credit budget.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board-writes          # never collide with the daily sweep
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Freeze closing prices
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOSE_DAILY_CREDITS: "240"    # ceiling on what this job may spend per day
        run: python close.py

      - name: Publish
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A
          git diff --staged --quiet && echo "Nothing changed" && exit 0
          git commit -m "Closing prices $(date -u '+%Y-%m-%d %H:%M')"
          git push
